[project]
name = "industrial-video-safety-lab"
version = "0.1.0"
description = "Local source-time video observation and bounded evidence review prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic-ai-slim[openai]==2.54.0",
  "python-dotenv==1.2.4",
  "av==19.0.1",
  "opencv-python==5.0.0.93",
  "imageio-ffmpeg==0.6.0",
  "openai==3.26.0",
]

[project.optional-dependencies]
people = ["rfdetr==1.11.1", "supervision==0.30.6"]
cv = ["rfdetr[train]==1.11.1", "supervision==0.30.6", "trackers==2.6.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.0,<2", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = [".", "backend", "backend/src"]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"
